<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medical AI Platform</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 960px;
        margin: 60px auto;
        padding: 24px;
        color: #1f2937;
      }
      .card {
        background: #f8fafc;
        border: 1px solid #dbe2ea;
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 24px;
      }
      .register-card {
        margin-top: 20px;
      }
      .field-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 14px;
      }
      label {
        margin-bottom: 6px;
        font-weight: 600;
      }
      input {
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        font-size: 1rem;
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.98rem;
      }
      .message-box {
        margin-top: 14px;
        padding: 10px 12px;
        border-radius: 8px;
        background: #e2e8f0;
        color: #1f2937;
      }
      .message-box.success {
        background: #dcfce7;
        color: #166534;
      }
      .message-box.error {
        background: #fee2e2;
        color: #991b1b;
      }
      code {
        background: #e2e8f0;
        padding: 4px 8px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Medical AI Platform</h1>
      <p>Foundation UI for the backend health check.</p>
      <button id="checkHealth">Check backend health</button>
      <pre id="result">Waiting for health check...</pre>
    </div>

    <div class="card register-card">
      <h2>Register</h2>
      <form id="registerForm">
        <div class="field-group">
          <label for="first_name">First name</label>
          <input id="first_name" name="first_name" type="text" required />
        </div>

        <div class="field-group">
          <label for="last_name">Last name</label>
          <input id="last_name" name="last_name" type="text" required />
        </div>

        <div class="field-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />
        </div>

        <div class="field-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required />
        </div>

        <button type="submit">Create account</button>
      </form>

      <div id="registerMessage" class="message-box"></div>
    </div>

    <script>
      const button = document.getElementById("checkHealth");
      const result = document.getElementById("result");
      const registerForm = document.getElementById("registerForm");
      const registerMessage = document.getElementById("registerMessage");

      button.addEventListener("click", async () => {
        try {
          const response = await fetch("http://127.0.0.1:5000/api/health");
          const data = await response.json();
          result.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
          result.textContent =
            "Backend not reachable. Start the Flask API first.";
        }
      });

      registerForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const payload = {
          first_name: document.getElementById("first_name").value,
          last_name: document.getElementById("last_name").value,
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        };

        registerMessage.textContent = "Creating account...";
        registerMessage.className = "message-box";

        try {
          const response = await fetch(
            "http://127.0.0.1:5000/api/auth/register",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(payload),
            },
          );

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || "Registration failed");
          }

          registerMessage.textContent =
            "Registration successful. User created.";
          registerMessage.classList.add("success");
          registerForm.reset();
        } catch (error) {
          registerMessage.textContent = error.message;
          registerMessage.classList.add("error");
        }
      });
    </script>
  </body>
</html>
